
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Night Racer</title>
<style>
*{box-sizing:border-box}
body{margin:0;text-align:center;color:white;font-family:Arial;background:radial-gradient(circle at top,#172554,#020617 70%)}
h1{color:#67e8f9;text-shadow:0 0 15px #06b6d4}
#hud{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin:10px}
#hud span{color:#fde68a}
canvas{background:#111827;border:3px solid #22d3ee;border-radius:12px;width:min(400px,95vw);height:auto;display:block;margin:10px auto;box-shadow:0 0 20px #0891b2}
button{padding:11px 16px;margin:5px;border:0;border-radius:10px;background:#0891b2;color:white;font-weight:bold;cursor:pointer}
button:hover{background:#0e7490}
#controls button{width:80px;font-size:20px}
.panel{background:#0f172a;border:1px solid #334155;border-radius:12px;padding:15px;margin:12px auto;max-width:400px}
#garage,#achievements{display:none}
#turboBar{width:200px;height:14px;background:#334155;border-radius:10px;display:inline-block;overflow:hidden}
#turboFill{height:100%;width:100%;background:linear-gradient(90deg,#22d3ee,#facc15)}
#notice{position:fixed;top:15px;left:50%;transform:translateX(-50%);background:#14532d;border:2px solid #4ade80;border-radius:12px;padding:15px;display:none;z-index:10}
.carOption{border:1px solid #475569;padding:10px;border-radius:10px;margin:8px}
input[type=range]{width:150px}
</style>
</head>
<body>

<h1>🏎️ NIGHT RACER</h1>

<div id="hud">
<div>Score: <span id="score">0</span></div>
<div>Best: <span id="best">0</span></div>
<div>Coins: 🪙 <span id="coins">0</span></div>
<div>Speed: <span id="speed">1</span></div>
</div>

<div>Turbo: <div id="turboBar"><div id="turboFill"></div></div></div>

<div class="panel">
<h3>🎵 Original Night Racer Music</h3>
<button id="musicBtn" onclick="toggleMusic()">🎵 MUSIC ON</button>
<button id="muteBtn" onclick="toggleMute()">🔊 SOUND</button>
<br>
<label>Music Volume </label>
<input type="range" min="0" max="100" value="30" oninput="setVolume(this.value)">
<p style="font-size:12px;color:#94a3b8">Original synthesized soundtrack.</p>
</div>

<canvas id="game" width="400" height="600"></canvas>

<div>
<button onclick="startGame()">▶ START</button>
<button onclick="togglePause()">⏸ PAUSE</button>
<button onclick="resetGame()">🔄 RESET</button>
<button onclick="openGarage()">🚘 GARAGE</button>
<button onclick="openAchievements()">🏆 ACHIEVEMENTS</button>
</div>

<div id="controls">
<button id="leftBtn">⬅</button>
<button id="turboBtn">⚡</button>
<button id="rightBtn">➡</button>
</div>

<div class="panel" id="garage">
<h2>🚘 Garage</h2>
<div id="carList"></div>
<button onclick="closePanels()">CLOSE</button>
</div>

<div class="panel" id="achievements">
<h2>🏆 Achievements</h2>
<div id="achievementList"></div>
<button onclick="closePanels()">CLOSE</button>
</div>

<div id="notice"></div>

<script>
// =========================
// GAME VARIABLES FIRST
// =========================

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const $=id=>document.getElementById(id);

let score=0;
let running=false;
let paused=false;
let gameOver=false;
let turbo=false;
let turboPower=100;
let roadOffset=0;
let lastTime=0;
let enemyTimer=0;
let coinTimer=0;
let speed=1;
let enemies=[];
let pickups=[];
let keys={};

const player={x:180,y:490,w:40,h:65};

const cars=[
{name:"Starter",color:"#38bdf8",price:0},
{name:"Fire Racer",color:"#ef4444",price:150},
{name:"Lime Machine",color:"#84cc16",price:300},
{name:"Purple Storm",color:"#a855f7",price:500},
{name:"Golden Legend",color:"#facc15",price:800}
];

const coinAchievements=[
{name:"Coin Rookie",target:50,reward:25},
{name:"Coin Collector",target:250,reward:100},
{name:"Coin Hunter",target:500,reward:200},
{name:"Coin Master",target:1000,reward:400},
{name:"Coin Legend",target:2500,reward:750},
{name:"Millionaire Racer",target:5000,reward:1500}
];

const otherAchievements=[
{name:"First Race",target:100,reward:50},
{name:"Speed Demon",target:5,reward:100},
{name:"Survivor",target:500,reward:150},
{name:"High Scorer",target:1000,reward:250},
{name:"Turbo Master",target:10,reward:100}
];

let coins=Number(localStorage.getItem("nrCoins"))||0;
let best=Number(localStorage.getItem("nrBest"))||0;
let unlockedCars=JSON.parse(localStorage.getItem("nrCars")||"[0]");
let selectedCar=Number(localStorage.getItem("nrSelected"))||0;
let unlockedAchievements=JSON.parse(localStorage.getItem("nrAchievements")||"[]");
let turboUses=Number(localStorage.getItem("nrTurboUses"))||0;

// =========================
// ORIGINAL MUSIC
// =========================

let audioCtx=null;
let musicOn=true;
let muted=false;
let masterGain=null;
let musicTimer=null;
let musicStep=0;
let musicVolume=.30;

function initAudio(){
if(audioCtx)return;
audioCtx=new(window.AudioContext||window.webkitAudioContext)();
masterGain=audioCtx.createGain();
masterGain.gain.value=muted?0:musicVolume;
masterGain.connect(audioCtx.destination);
}

function setVolume(value){
musicVolume=Number(value)/100;
if(masterGain)masterGain.gain.setTargetAtTime(muted?0:musicVolume,audioCtx.currentTime,.05);
}

function toggleMute(){
muted=!muted;
$("muteBtn").textContent=muted?"🔇 MUTED":"🔊 SOUND";
if(masterGain)masterGain.gain.setTargetAtTime(muted?0:musicVolume,audioCtx.currentTime,.05);
}

function toggleMusic(){
musicOn=!musicOn;
$("musicBtn").textContent=musicOn?"🎵 MUSIC ON":"🎵 MUSIC OFF";
if(musicOn){initAudio();audioCtx.resume();startMusic();}
else stopMusic();
}

function note(freq,time,duration,type="triangle",volume=.12){
if(!audioCtx||!musicOn)return;
const osc=audioCtx.createOscillator();
const gain=audioCtx.createGain();
osc.type=type;
osc.frequency.value=freq;
gain.gain.setValueAtTime(.001,time);
gain.gain.linearRampToValueAtTime(volume,time+.02);
gain.gain.exponentialRampToValueAtTime(.001,time+duration);
osc.connect(gain);gain.connect(masterGain);
osc.start(time);osc.stop(time+duration+.02);
}

function drum(time){
if(!audioCtx||!musicOn)return;
const kick=audioCtx.createOscillator();
const kg=audioCtx.createGain();
kick.type="sine";
kick.frequency.setValueAtTime(120,time);
kick.frequency.exponentialRampToValueAtTime(40,time+.12);
kg.gain.setValueAtTime(.25,time);
kg.gain.exponentialRampToValueAtTime(.001,time+.16);
kick.connect(kg);kg.connect(masterGain);
kick.start(time);kick.stop(time+.17);

const buffer=audioCtx.createBuffer(1,22050,22050);
const data=buffer.getChannelData(0);
for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1;
const noise=audioCtx.createBufferSource();
const ng=audioCtx.createGain();
noise.buffer=buffer;
ng.gain.setValueAtTime(.08,time);
ng.gain.exponentialRampToValueAtTime(.001,time+.10);
noise.connect(ng);ng.connect(masterGain);
noise.start(time);noise.stop(time+.11);
}

const bassNotes=[55,55,82.41,55,65.41,65.41,98,65.41];
const melody=[220,261.63,329.63,392,329.63,261.63,196,261.63];

function musicTick(){
if(!audioCtx||!musicOn)return;
const t=audioCtx.currentTime+.03;
const step=musicStep%16;
note(bassNotes[step%8],t,.25,"sawtooth",.07);
if(step%2===0)note(melody[(step/2)%8],t,.35,"triangle",.045);
if(step%4===0)drum(t);
musicStep++;
}

function startMusic(){
if(!musicOn)return;
initAudio();audioCtx.resume();
if(musicTimer)return;
musicTimer=setInterval(musicTick,180);
}

function stopMusic(){
clearInterval(musicTimer);
musicTimer=null;
}

// =========================
// SAVE / HUD
// =========================

function saveData(){
localStorage.setItem("nrCoins",coins);
localStorage.setItem("nrBest",best);
localStorage.setItem("nrCars",JSON.stringify(unlockedCars));
localStorage.setItem("nrSelected",selectedCar);
localStorage.setItem("nrAchievements",JSON.stringify(unlockedAchievements));
localStorage.setItem("nrTurboUses",turboUses);
}

function updateHUD(){
$("score").textContent=score;
$("best").textContent=best;
$("coins").textContent=coins;
$("speed").textContent=speed;
$("turboFill").style.width=turboPower+"%";
}

function notify(message){
const n=$("notice");
n.textContent=message;
n.style.display="block";
clearTimeout(notify.timer);
notify.timer=setTimeout(()=>n.style.display="none",2500);
}

// =========================
// GAME FUNCTIONS
// =========================

function startGame(){
closePanels();
initAudio();
if(musicOn)startMusic();
resetGame();
running=true;
paused=false;
gameOver=false;
lastTime=performance.now();
}

function resetGame(){
score=0;speed=1;turboPower=100;turbo=false;
enemies=[];pickups=[];enemyTimer=0;coinTimer=0;
roadOffset=0;player.x=180;gameOver=false;paused=false;
updateHUD();draw();
}

function togglePause(){
if(!running||gameOver)return;
paused=!paused;
}

function endGame(){
running=false;
gameOver=true;
if(score>best)best=score;
saveData();updateHUD();draw();
}

function drawRoad(){
ctx.fillStyle="#166534";ctx.fillRect(0,0,400,600);
ctx.fillStyle="#374151";ctx.fillRect(40,0,320,600);
ctx.fillStyle="white";ctx.fillRect(44,0,4,600);ctx.fillRect(352,0,4,600);
ctx.fillStyle="#facc15";
for(let y=-60;y<600;y+=100){
ctx.fillRect(145,y+roadOffset,5,50);
ctx.fillRect(250,y+roadOffset,5,50);
}
}

function drawCar(x,y,color,w=40,h=65){
ctx.fillStyle="#020617";ctx.fillRect(x-3,y+8,w+6,h-10);
ctx.fillStyle=color;ctx.fillRect(x,y+8,w,h-16);
ctx.fillStyle="#0f172a";ctx.fillRect(x+5,y+18,w-10,18);
ctx.fillStyle="#bae6fd";ctx.fillRect(x+7,y+20,w-14,8);
ctx.fillStyle="#111827";
ctx.fillRect(x+2,y+4,8,14);ctx.fillRect(x+w-10,y+4,8,14);
ctx.fillRect(x+2,y+h-18,8,14);ctx.fillRect(x+w-10,y+h-18,8,14);
ctx.fillStyle="#fef08a";
ctx.fillRect(x+4,y+2,8,5);ctx.fillRect(x+w-12,y+2,8,5);
ctx.fillStyle="#ef4444";
ctx.fillRect(x+4,y+h-10,8,5);ctx.fillRect(x+w-12,y+h-10,8,5);
}

function draw(){
drawRoad();
pickups.forEach(c=>{
ctx.fillStyle="#facc15";
ctx.beginPath();ctx.arc(c.x,c.y,11,0,Math.PI*2);ctx.fill();
ctx.fillStyle="#fef3c7";
ctx.beginPath();ctx.arc(c.x-3,c.y-3,4,0,Math.PI*2);ctx.fill();
});
enemies.forEach(e=>drawCar(e.x,e.y,e.color));
drawCar(player.x,player.y,cars[selectedCar].color);

if(!running){
ctx.fillStyle="rgba(0,0,0,.65)";ctx.fillRect(0,0,400,600);
ctx.fillStyle="white";ctx.textAlign="center";ctx.font="bold 28px Arial";
ctx.fillText(gameOver?"GAME OVER":"NIGHT RACER",200,280);
ctx.font="18px Arial";
ctx.fillText(gameOver?"Score: "+score:"Press START to begin",200,325);
}
if(paused){
ctx.fillStyle="rgba(0,0,0,.65)";ctx.fillRect(0,0,400,600);
ctx.fillStyle="white";ctx.font="bold 30px Arial";ctx.textAlign="center";
ctx.fillText("PAUSED",200,300);
}
}

function spawnEnemy(){
const lanes=[70,175,280];
enemies.push({
x:lanes[Math.floor(Math.random()*3)],y:-80,w:40,h:65,
color:["#ef4444","#a855f7","#f97316","#e5e7eb"][Math.floor(Math.random()*4)]
});
}

function spawnCoin(){
const lanes=[70,175,280];
pickups.push({x:lanes[Math.floor(Math.random()*3)]+20,y:-20});
}

function collision(a,b){
return a.x+5<b.x+b.w-5&&a.x+a.w-5>b.x+5&&
a.y+8<b.y+b.h-8&&a.y+a.h-8>b.y+8;
}

function collectCoin(){
coins+=5;score+=5;
saveData();checkAchievements();updateHUD();
}

function checkAchievements(){
const all=[...coinAchievements,...otherAchievements];
all.forEach((a,index)=>{
if(unlockedAchievements.includes(index))return;
let complete=false;
if(index<coinAchievements.length)complete=coins>=a.target;
else{
const type=index-coinAchievements.length;
if(type===0)complete=score>=100;
if(type===1)complete=speed>=5;
if(type===2)complete=score>=500;
if(type===3)complete=score>=1000;
if(type===4)complete=turboUses>=10;
}
if(complete){
unlockedAchievements.push(index);
coins+=a.reward;
notify("🏆 "+a.name+"! +"+a.reward+" bonus coins!");
saveData();
}
});
updateHUD();
}

function activateTurbo(){
if(!running||paused||turboPower<=0||turbo)return;
turbo=true;turboUses++;
localStorage.setItem("nrTurboUses",turboUses);
checkAchievements();
}
function stopTurbo(){turbo=false;}

function update(dt){
if(!running||paused||gameOver)return;
const movement=260*dt;
if(keys.ArrowLeft||keys.a||keys.A)player.x-=movement;
if(keys.ArrowRight||keys.d||keys.D)player.x+=movement;
player.x=Math.max(45,Math.min(315,player.x));

if(turbo&&turboPower>0){
turboPower-=30*dt;
if(turboPower<=0){turboPower=0;turbo=false;}
}else turboPower=Math.min(100,turboPower+10*dt);

const multiplier=turbo?2:1;
roadOffset=(roadOffset+250*dt*multiplier)%100;
score+=Math.floor(dt*10*multiplier);
speed=1+Math.floor(score/250);

enemyTimer+=dt;coinTimer+=dt;
if(enemyTimer>Math.max(.45,1.2-speed*.06)){spawnEnemy();enemyTimer=0;}
if(coinTimer>1.3){spawnCoin();coinTimer=0;}

enemies.forEach(e=>{
e.y+=220*dt*multiplier;
if(collision(player,e))endGame();
});
enemies=enemies.filter(e=>e.y<650);

pickups.forEach(c=>{
c.y+=200*dt*multiplier;
if(collision(player,{x:c.x-10,y:c.y-10,w:20,h:20})){
c.collected=true;collectCoin();
}
});
pickups=pickups.filter(c=>c.y<650&&!c.collected);
checkAchievements();updateHUD();
}

// =========================
// CONTROLS
// =========================

document.addEventListener("keydown",e=>{
keys[e.key]=true;
if(e.key==="ArrowUp")activateTurbo();
if(e.key===" "){e.preventDefault();resetGame();running=true;}
if(e.key.toLowerCase()==="p")togglePause();
});
document.addEventListener("keyup",e=>{
keys[e.key]=false;
if(e.key==="ArrowUp")stopTurbo();
});

function holdButton(id,key){
const b=$(id);
b.addEventListener("pointerdown",e=>{e.preventDefault();keys[key]=true;});
["pointerup","pointerleave","pointercancel"].forEach(evt=>{
b.addEventListener(evt,()=>keys[key]=false);
});
}
holdButton("leftBtn","ArrowLeft");
holdButton("rightBtn","ArrowRight");
$("turboBtn").addEventListener("pointerdown",activateTurbo);
["pointerup","pointerleave","pointercancel"].forEach(evt=>{
$("turboBtn").addEventListener(evt,stopTurbo);
});

// =========================
// GARAGE
// =========================

function openGarage(){
running=false;
$("garage").style.display="block";
$("achievements").style.display="none";
renderGarage();
}

function closePanels(){
$("garage").style.display="none";
$("achievements").style.display="none";
}

function renderGarage(){
const list=$("carList");list.innerHTML="";
cars.forEach((car,i)=>{
const div=document.createElement("div");
div.className="carOption";
const owned=unlockedCars.includes(i);
div.innerHTML=`<h3 style="color:${car.color}">${car.name}</h3>
<p>${owned?"UNLOCKED":"Price: "+car.price+" coins"}</p>
<button>${selectedCar===i?"SELECTED":owned?"SELECT":"UNLOCK"}</button>`;
div.querySelector("button").onclick=()=>{
if(owned){
selectedCar=i;
localStorage.setItem("nrSelected",i);
}else if(coins>=car.price){
coins-=car.price;
unlockedCars.push(i);
selectedCar=i;
saveData();
notify("🚘 "+car.name+" unlocked!");
}else notify("Not enough coins!");
renderGarage();updateHUD();
};
list.appendChild(div);
});
}

// =========================
// ACHIEVEMENTS
// =========================

function openAchievements(){
running=false;
$("achievements").style.display="block";
$("garage").style.display="none";
renderAchievements();
}

function renderAchievements(){
const list=$("achievementList");list.innerHTML="";
[...coinAchievements,...otherAchievements].forEach((a,index)=>{
const unlocked=unlockedAchievements.includes(index);
const div=document.createElement("div");
div.className="carOption";
const requirement=index<coinAchievements.length?
"Collect "+a.target+" total coins":
["Reach 100 score","Reach speed level 5","Reach 500 score",
"Reach 1000 score","Use turbo 10 times"][index-coinAchievements.length];
div.innerHTML=`<h3>${unlocked?"✅":"🔒"} ${a.name}</h3>
<p>${requirement}</p><p>Reward: ${a.reward} coins</p>
<strong>${unlocked?"COMPLETED":"LOCKED"}</strong>`;
list.appendChild(div);
});
}

// =========================
// ANIMATION LOOP LAST
// =========================

function loop(time){
const dt=lastTime?Math.min((time-lastTime)/1000,.04):0;
lastTime=time;
update(dt);
draw();
requestAnimationFrame(loop);
}

updateHUD();
draw();
requestAnimationFrame(loop);

</script>
</body>
</html>
